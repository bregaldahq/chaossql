[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chaossql"
version = "1.4.0"
description = "Deterministic Concurrency & Invariant Fuzzer for SQL Databases (Python SDK)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "ChaosSQL Contributors", email = "oss@chaossql.dev" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
pytest = ["pytest>=7.0.0", "pyyaml>=6.0"]
test = ["pytest>=7.0.0", "pyyaml>=6.0"]

[project.entry-points.pytest11]
chaossql = "chaossql.pytest_plugin"
