name = "chaossql"
main = "./worker.ts"
compatibility_date = "2024-09-01"

routes = [
  { pattern = "chaossql.bregalda.com", custom_domain = true }
]

[assets]
directory = "./site"
# Exposes the assets to worker.ts as env.ASSETS. Without it every path the
# worker handles (run_worker_first routes, robots.txt fallbacks) throws.
binding = "ASSETS"
not_found_handling = "single-page-application"
# Section URLs must reach the worker so it can inject per-route <title>,
# description and canonical into the app shell (see ROUTE_META in worker.ts).
run_worker_first = [
  "/dashboard", "/dashboard/",
  "/docs", "/docs/",
  "/scenarios", "/scenarios/",
  "/visualizer", "/visualizer/",
  "/matrix", "/matrix/",
  "/playground", "/playground/",
  "/pricing", "/pricing/",
]

# DISCORD_WEBHOOK_URL is intentionally NOT declared here.
# [vars] values are stored in plaintext and are visible in the Cloudflare
# dashboard and in this repository. Set it as an encrypted secret instead:
#   npx wrangler secret put DISCORD_WEBHOOK_URL
