name = "chaossql"
main = "./worker.ts"
compatibility_date = "2024-09-01"

routes = [
  { pattern = "chaossql.bregalda.com", custom_domain = true }
]

[assets]
directory = "./site"
# Exposes the assets to worker.ts as env.ASSETS. Without it every path the
# worker handles (run_worker_first routes, robots.txt fallbacks) throws.
binding = "ASSETS"
not_found_handling = "single-page-application"
# Section URLs must reach the worker so it can inject per-route <title>,
# description and canonical into the app shell (see ROUTE_META in worker.ts).
run_worker_first = [
  "/",
  "/dashboard", "/dashboard/",
  "/docs", "/docs/",
  "/scenarios", "/scenarios/",
  "/visualizer", "/visualizer/",
  "/matrix", "/matrix/",
  "/playground", "/playground/",
  "/pricing", "/pricing/",
]

# Cookieless site events posted to /api/event (see site/src/lib/analytics.ts).
# Query them with the Analytics Engine SQL API: SELECT blob1 AS event, blob2 AS
# label, SUM(_sample_interval) AS n FROM chaossql_site_events GROUP BY event, label
[[analytics_engine_datasets]]
binding = "SITE_EVENTS"
dataset = "chaossql_site_events"

# Cloudflare Web Analytics (cookieless page views). The site token is public by
# design (it ships in the page HTML); fill it in from Cloudflare dashboard >
# Analytics & Logs > Web Analytics > chaossql.bregalda.com. Empty = no beacon.
[vars]
CF_WEB_ANALYTICS_TOKEN = ""

# DISCORD_WEBHOOK_URL is intentionally NOT declared here.
# [vars] values are stored in plaintext and are visible in the Cloudflare
# dashboard and in this repository. Set it as an encrypted secret instead:
#   npx wrangler secret put DISCORD_WEBHOOK_URL
