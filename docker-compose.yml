name: chaossql-enterprise

services:
  chaossql-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/chaossql-cloud.db
      - CHAOSSQL_ADMIN_TOKEN=${CHAOSSQL_ADMIN_TOKEN:?Set a unique CHAOSSQL_ADMIN_TOKEN in .env}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - chaossql_data:/data
    networks:
      - chaossql-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  chaossql-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:8080"
    depends_on:
      chaossql-server:
        condition: service_healthy
    networks:
      - chaossql-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-test}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chaossql-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  chaossql_data:
    name: ${CHAOSSQL_DATA_VOLUME:-chaossql_enterprise_data}
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME:-chaossql_postgres_data}

networks:
  chaossql-net:
    driver: bridge
