name: ChaosSQL CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Verification & Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache: true

    - name: Validate Harness Artifacts
      run: make check-harness

    - name: Run Linter & Vet
      run: make lint

    - name: Run Unit & Concurrency Tests (-race)
      run: make test

    - name: Build Binary (Zero CGO)
      run: make build

    - name: Run Interactive Demo Battery
      run: make demo
