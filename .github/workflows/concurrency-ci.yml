name: Concurrency Verification (ChaosSQL)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  concurrency-gate:
    name: Concurrency Invariant & Isolation Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      # The banking example has a lost update on purpose, so a working gate
      # fails this step. The next step turns that expected failure into a pass.
      - name: Run ChaosSQL on a scenario with a known lost update
        id: gate
        uses: ./
        continue-on-error: true
        with:
          spec-path: 'examples/banking_lost_update/chaos.yaml'
          cloud-token: ${{ secrets.CHAOSSQL_CLOUD_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          post-pr-comment: 'true'

      - name: Require the gate to fail on the lost update
        if: steps.gate.outcome != 'failure'
        run: |
          echo "::error::ChaosSQL did not fail on a scenario with a known lost update (outcome: ${{ steps.gate.outcome }})"
          exit 1
