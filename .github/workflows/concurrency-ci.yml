name: Concurrency Verification (ChaosSQL)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  concurrency-gate:
    name: Concurrency Invariant & Isolation Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run ChaosSQL Concurrency Fuzzer
        uses: ./
        with:
          spec-path: 'examples/banking_lost_update/chaos.yaml'
          cloud-token: ${{ secrets.CHAOSSQL_CLOUD_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          post-pr-comment: 'true'
          export-summary: 'true'
