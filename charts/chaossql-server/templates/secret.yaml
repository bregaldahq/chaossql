{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chaossql-server.fullname" . }}-secrets
  labels:
    {{- include "chaossql-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  CHAOSSQL_ADMIN_TOKEN: {{ required "Set secrets.existingSecret or a unique secrets.adminToken" .Values.secrets.adminToken | quote }}
  {{- if .Values.secrets.discordWebhookUrl }}
  DISCORD_WEBHOOK_URL: {{ .Values.secrets.discordWebhookUrl | quote }}
  {{- end }}
{{- end }}
