name: 'ChaosSQL'
description: 'Deterministic Concurrency & Invariant Fuzzer for SQL Databases. Discovers isolation anomalies and synthesizes minimal delta-debugged reproductions.'
author: 'Bregalda'
branding:
  icon: 'zap'
  color: 'purple'

inputs:
  spec-path:
    description: 'Path to the chaos.yaml specification file'
    required: true
  workers:
    description: 'Number of concurrent worker goroutines (overrides spec)'
    required: false
    default: ''
  iterations:
    description: 'Total number of operations to execute (overrides spec)'
    required: false
    default: ''
  seed:
    description: 'Deterministic PRNG seed (overrides spec)'
    required: false
    default: ''
  export-html:
    description: 'Path to export standalone interactive HTML report'
    required: false
    default: ''
  export-junit:
    description: 'Path to export JUnit XML test report'
    required: false
    default: ''
  export-summary:
    description: 'Path to export GitHub Step Summary markdown'
    required: false
    default: ''
  export-repro:
    description: 'Export minimal reproduction as standalone Go test (repro_test.go)'
    required: false
    default: 'false'
  export-mermaid:
    description: 'Export execution sequence diagram as Mermaid format (trace.mermaid)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache: true

    - name: Build ChaosSQL Binary
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        go build -o /tmp/chaossql ./cmd/chaossql

    - name: Execute ChaosSQL
      shell: bash
      run: |
        ARGS=("run" "${{ inputs.spec-path }}")
        if [ -n "${{ inputs.workers }}" ]; then
          ARGS+=("--workers" "${{ inputs.workers }}")
        fi
        if [ -n "${{ inputs.iterations }}" ]; then
          ARGS+=("--iterations" "${{ inputs.iterations }}")
        fi
        if [ -n "${{ inputs.seed }}" ]; then
          ARGS+=("--seed" "${{ inputs.seed }}")
        fi
        if [ -n "${{ inputs.export-html }}" ]; then
          ARGS+=("--export-html" "${{ inputs.export-html }}")
        fi
        if [ -n "${{ inputs.export-junit }}" ]; then
          ARGS+=("--export-junit" "${{ inputs.export-junit }}")
        fi
        if [ -n "${{ inputs.export-summary }}" ]; then
          ARGS+=("--export-summary" "${{ inputs.export-summary }}")
        elif [ -n "$GITHUB_STEP_SUMMARY" ]; then
          ARGS+=("--export-summary" "$GITHUB_STEP_SUMMARY")
        fi
        if [ "${{ inputs.export-repro }}" = "true" ]; then
          ARGS+=("--export-repro")
        fi
        if [ "${{ inputs.export-mermaid }}" = "true" ]; then
          ARGS+=("--export-mermaid")
        fi

        /tmp/chaossql "${ARGS[@]}"
