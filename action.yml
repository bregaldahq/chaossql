name: 'ChaosSQL'
description: 'Deterministic Concurrency & Invariant Fuzzer for SQL Databases. Discovers isolation anomalies and synthesizes minimal delta-debugged reproductions.'
author: 'Bregalda'
branding:
  icon: 'zap'
  color: 'purple'

inputs:
  spec-path:
    description: 'Path to the chaos.yaml specification file'
    required: true
  workers:
    description: 'Number of concurrent worker goroutines (overrides spec)'
    required: false
    default: ''
  iterations:
    description: 'Total number of operations to execute (overrides spec)'
    required: false
    default: ''
  seed:
    description: 'Deterministic PRNG seed (overrides spec)'
    required: false
    default: ''
  export-html:
    description: 'Path to export standalone interactive HTML report'
    required: false
    default: ''
  export-junit:
    description: 'Path to export JUnit XML test report'
    required: false
    default: ''
  export-summary:
    description: 'Path to export GitHub Step Summary markdown'
    required: false
    default: ''
  export-repro:
    description: 'Export minimal reproduction as standalone Go test (repro_test.go)'
    required: false
    default: 'false'
  export-mermaid:
    description: 'Export execution sequence diagram as Mermaid format (trace.mermaid)'
    required: false
    default: 'false'
  cloud-token:
    description: 'ChaosSQL Cloud API authentication token. Pass it from a repository secret, e.g. secrets.CHAOSSQL_CLOUD_TOKEN'
    required: false
    default: ''
  cloud-url:
    description: 'ChaosSQL Cloud API base URL'
    required: false
    default: 'https://api.chaossql.bregalda.com'
  cloud-fail-fast:
    description: 'Fail step if publishing to ChaosSQL Cloud fails (true|false)'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for posting automated concurrency reports to Pull Requests (defaults to github.token)'
    required: false
    default: '${{ github.token }}'
  post-pr-comment:
    description: 'Automatically post concurrency report comment on Pull Request (true|false)'
    required: false
    default: 'true'


outputs:
  cloud-run-id:
    description: 'ID of the acknowledged Cloud run'
    value: ${{ steps.execute.outputs.cloud-run-id }}
  cloud-run-url:
    description: 'URL of the acknowledged Cloud run'
    value: ${{ steps.execute.outputs.cloud-run-url }}
  is-regression:
    description: 'Whether Cloud identified a concurrency regression'
    value: ${{ steps.execute.outputs.is-regression }}

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache: true

    - name: Build ChaosSQL Binary
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CGO_ENABLED: '0'
      run: |
        cd "$ACTION_PATH"
        go build -o "$RUNNER_TEMP/chaossql" ./cmd/chaossql

    - name: Execute ChaosSQL
      id: execute
      shell: bash
      env:
        SPEC_PATH: ${{ inputs.spec-path }}
        WORKERS: ${{ inputs.workers }}
        ITERATIONS: ${{ inputs.iterations }}
        SEED: ${{ inputs.seed }}
        EXPORT_HTML: ${{ inputs.export-html }}
        EXPORT_JUNIT: ${{ inputs.export-junit }}
        EXPORT_SUMMARY: ${{ inputs.export-summary }}
        EXPORT_REPRO: ${{ inputs.export-repro }}
        EXPORT_MERMAID: ${{ inputs.export-mermaid }}
        CHAOSSQL_CLOUD_TOKEN: ${{ inputs.cloud-token }}
        CHAOSSQL_CLOUD_URL: ${{ inputs.cloud-url }}
        CLOUD_FAIL_FAST: ${{ inputs.cloud-fail-fast }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        POST_PR_COMMENT: ${{ inputs.post-pr-comment }}
      run: |
        ARGS=("run" "$SPEC_PATH")
        if [ -n "$WORKERS" ]; then
          ARGS+=("--workers" "$WORKERS")
        fi
        if [ -n "$ITERATIONS" ]; then
          ARGS+=("--iterations" "$ITERATIONS")
        fi
        if [ -n "$SEED" ]; then
          ARGS+=("--seed" "$SEED")
        fi
        if [ -n "$EXPORT_HTML" ]; then
          ARGS+=("--export-html" "$EXPORT_HTML")
        fi
        if [ -n "$EXPORT_JUNIT" ]; then
          ARGS+=("--export-junit" "$EXPORT_JUNIT")
        fi
        if [ -n "$EXPORT_SUMMARY" ]; then
          ARGS+=("--export-summary" "$EXPORT_SUMMARY")
        elif [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          ARGS+=("--export-summary" "$GITHUB_STEP_SUMMARY")
        fi
        if [ "$EXPORT_REPRO" = "true" ]; then
          ARGS+=("--export-repro")
        fi
        if [ "$EXPORT_MERMAID" = "true" ]; then
          ARGS+=("--export-mermaid")
        fi
        if [ "$CLOUD_FAIL_FAST" = "true" ]; then
          ARGS+=("--cloud-fail-fast")
        fi
        if [ "$POST_PR_COMMENT" = "false" ]; then
          ARGS+=("--pr-comment=false")
        fi

        "$RUNNER_TEMP/chaossql" "${ARGS[@]}"
