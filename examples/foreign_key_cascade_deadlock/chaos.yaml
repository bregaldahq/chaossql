version: "1.0"
name: "foreign_key_cascade_deadlock"
description: "Detects relational lock hierarchy inversion and foreign key cascade deadlocks"

database:
  driver: "sqlite"
  schema: "schema.sql"
  seed: "seed.sql"

engine:
  workers: 2
  iterations: 20
  seed: 42
  jitter_ms: [0, 5]

invariants:
  - name: "referential_integrity"
    query: "SELECT count(*) AS orphan_items FROM child_items LEFT JOIN parent_orders ON child_items.order_id = parent_orders.id WHERE parent_orders.id IS NULL;"
    assert: "orphan_items == 0"

  - name: "order_sum_consistency"
    query: >
      SELECT count(*) AS inconsistent_orders
      FROM parent_orders p
      LEFT JOIN (
        SELECT order_id, COALESCE(sum(price_cents), 0) AS items_sum
        FROM child_items
        GROUP BY order_id
      ) c ON p.id = c.order_id
      WHERE p.status = 'OPEN' AND p.total_cents != COALESCE(c.items_sum, 0);
    assert: "inconsistent_orders == 0"

operations:
  - name: "add_order_item"
    weight: 1.0
    params:
      item_id: "$monotonic_counter(100)"
    steps:
      - sql: "INSERT INTO child_items (id, order_id, sku, price_cents) VALUES ({item_id}, 1, 'ITEM-ADDON', 1000);"
      - sql: "UPDATE parent_orders SET total_cents = total_cents + 1000 WHERE id = 1;"

  - name: "cancel_order_cascade"
    weight: 1.0
    steps:
      - sql: "UPDATE parent_orders SET status = 'CANCELLED' WHERE id = 1;"
      - sql: "DELETE FROM parent_orders WHERE id = 1;"
      - sql: "DELETE FROM child_items WHERE order_id = 1;"
